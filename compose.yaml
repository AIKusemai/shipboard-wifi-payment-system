services:
  postgres:
    image: postgres:16-alpine
    container_name: shiptourwifi-postgres
    environment:
      POSTGRES_DB: shiptourwifi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: shiptourwifi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shiptourwifi"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: shiptourwifi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
